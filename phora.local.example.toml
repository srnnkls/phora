# phora.local.toml: this machine's overrides of phora.toml, same schema; keep it out of version control.
# Sources named here lock in phora.local.lock. Link mode works in either file; phora warns when
# phora.toml declares the source and the linked path is absolute. Reference: REFERENCE.md#local-overlay

[sources.loqui]                 # override a source onto a local checkout and symlink it
path = "~/dev/loqui"
deploy = "link"

[vars]
email = "me@work.example"       # replaces this one key from phora.toml

[targets.neovim]
path = "~/.config/nvim-dev"     # an overriding target restates path; other keys are inherited
