# phora.local.toml overlays phora.toml (same schema, local values win per-key).
# It is machine-local: keep it out of version control.
#
# Link mode belongs here. `deploy = "link"` symlinks an artifact destination at the
# source's live working tree, so uncommitted edits in the checkout are visible
# through the target with no re-sync. It needs a local source (`path = "/dir"` or the
# `git = "/dir"` alias; a remote URL is a config error). A link resolves to a checkout
# on one machine, so phora warns rather than refuses when the committed phora.toml
# declares the same source and the link path is absolute; the override below prints
# that warning. A source declared only in this overlay, or a relative path, is silent.
# Linked artifacts sit outside the integrity model: verify and drift detection skip
# them; `phora list` shows them as `linked`.

version = 1

# Override an existing source onto a local checkout and live-link it.
[sources.loqui]
path = "/home/me/dev/loqui"  # local source: the live working tree
deploy = "link"
