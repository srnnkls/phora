# phora.toml: one example of every section. Reference: REFERENCE.md#configuration

# protocol = "ssh"              # remote template for forge sources; default "https"

[defaults]
auto_target = true              # `phora add` without --to binds into [targets.default]

# [paths]
# cache = ".phora/cache"        # git mirrors live under <cache>/git/
# state = ".phora/state"        # registry, journal and state.lock live under <state>/projects/

[vars]                          # values for *.tmpl files; phora.local.toml overrides them per key
email = "me@example.com"
editor = "nvim"

[hosts.company]                 # a custom forge; github, gitlab, codeberg, sr.ht and bitbucket are built in
remote = { https = "https://git.company.com/{path}.git", ssh = "git@git.company.com:{path}.git" }

[hooks]
pre_sync = "test -w ~/.config"                         # gate before any source is resolved; failure stops the sync
post_sync = "echo 'phora: synced'"                     # runs after target on_change hooks, before trusted transitive ones

[sources.dotfiles]              # forge source, following a branch
host = "github"                 # the default when repo is set
repo = "me/dotfiles"
branch = "main"
root = "modules"                # the offer starts at modules/

[sources.internal]
host = "company"
repo = "team/sub/proj"          # nested paths fill {path}
protocol = "ssh"
root = "configs"
include = ["editor", "lint"]    # gitignore syntax
exclude = ["**/test/**", "**/*.bak"] # exclude wins over include

[sources.fzf]                   # pinned to a tag; bindings can pin other refs
repo = "junegunn/fzf"
tag = "v0.55.0"
include = ["bin"]

[sources.loqui]                 # literal git remote, pinned to a full commit id
git = "https://github.com/srnnkls/loqui.git"
rev = "9e5d4de28b21871d2b67f40943e1d6d6ffa701a3"
root = "languages"
allow_symlinks = false
preserve_executable = true

[sources.scratch]               # local checkout; ~ expands to your home directory
path = "~/dev/scratch-configs"
branch = "main"

[sources.fzf-bin]               # a download, imported as one snapshot
url = "https://github.com/junegunn/fzf/releases/download/v0.55.0/fzf-0.55.0-linux_amd64.tar.gz"
digest = "sha256:4df2393776942780ddab2cea713ddaac06cd5c3886cd23bc9119a6d3aa1e02bd" # checked before extraction
include = ["fzf"]

[sources.toolkit]               # a package: its own phora.toml targets compose under an importing target
repo = "me/toolkit"
transitive = true

[sources.rust-book]             # deployed with its git history below
repo = "rust-lang/book"

[sources.skill-src]             # generator input
repo = "me/skill-sources"

[sources.skills]                # generator output, committed like any other source
build = { inputs = ["skill-src"], run = "./scripts/gen-skills $PHORA_INPUT/skill-src $PHORA_OUTPUT" }

[targets.neovim]
path = "~/.config/nvim"

[targets.neovim.sources]
nvim = { source = "dotfiles", take = ["nvim/**"], template = ["nvim/lua/user.lua"] } # identity nvim, one slice

[targets.neovim.hooks]
on_change = "nvim --headless '+Lazy! sync' +qa" # runs after this target's artifacts change

[targets.editors]
path = "~/.config/editors"
layout = "by-source"            # each artifact lands under its binding identity

[targets.editors.sources]
nvim = { source = "dotfiles", take = ["nvim/**"] }
helix = { source = "dotfiles", take = ["helix/**"], collapse = false } # one artifact per file

[targets.vscode]
path = "~/.config/Code/User"

[targets.vscode.sources]
dotfiles = { take = ["vscode/**", { "vscode/settings.json" = "settings.json" }] } # glob plus a rename
internal = {}

[targets.agents]
path = "~/.config/agents"

[targets.agents.sources]
dotfiles = { take = [{ "claude/" = "." }] } # subtree rename: claude/ lands at the target root

[targets.policies]
path = "~/.cupcake/policies/claude"
sources = ["loqui"]
layout = { type = "prefixed", separator = "/" }

[targets.policies.hooks]
pre_deploy = { run = "test -d ~/.cupcake", shell = "bash -c" } # gate checked before any target is written
pre_deploy_on_fail = "skip"     # a failed gate skips this target only

[targets.bin]
path = "~/.local/bin"
sources = ["fzf-bin"]

[targets.bin.hooks]
on_change = { cmd = ["fzf", "--version"] } # runs the program directly, with no shell

[targets.tools]
path = "~/.local/tools"
layout = "by-source"

[targets.tools.sources]
stable = { source = "fzf", tag = "v0.55.0" } # two identities, two refs, two lock entries
canary = { source = "fzf", tag = "v0.56.0" }

[targets.references]
path = "~/src/references"

[targets.references.sources]
rust-book = { history = true }  # a verified copy with `git log` available

[targets.toolkit]
path = "~/.config/toolkit"
imports = [{ source = "toolkit", tag = "v1.2.0" }] # import the package at a tag

[targets.toolkit.take]
toolkit = ["skills/**"]         # narrow what the package deploys

[targets.toolkit.collapse]
toolkit = false

[targets.skills]
path = "~/.claude/skills"
sources = ["skills"]
