[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]\
    {% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/srnnkls/phora/compare/v{{ release.previous.version | trim_start_matches(pat="v") }}...v{{ release.version | trim_start_matches(pat="v") }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
            [unreleased]: https://github.com/srnnkls/phora/compare/v{{ release.previous.version | trim_start_matches(pat="v") }}...HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = "^(\\w+!?)\\(cliff\\)", replace = "${1}" },
    { pattern = "\\((\\w+\\s)?#([0-9]+)\\)", replace = "([#${2}](https://github.com/srnnkls/phora/pull/${2}))" },
]
commit_parsers = [
    { message = "^(refactor|test|style|ci|build|chore)", skip = true },
    { message = "^\\w+!?\\((arch|architecture|bench|ci|compat|source-projection-sync)\\)", skip = true },
    { message = "^[^\\n]*\\b(INV-[0-9]+|PR[0-9]+|T[0-9]{3}|R1)\\b", skip = true },
    { message = "^[^\\n]*\\b(StageBridge|StateStore|SourceStore|SourceBackend|StageRequest|FileRegistry|ProgressSink|contract)\\b", skip = true },
    # Internal restructuring commits in 0.2.0 whose subjects name no user-facing change.
    { sha = "7506f5daf773d6e7910bf0f7efd7dd84001ae56b", skip = true },
    { sha = "cd5c766920b98afe1dbe0e3866987c478cf38c2d", skip = true },
    { sha = "09c373a5de5dc47bc8c95567c43a641e76887bba", skip = true },
    { sha = "eda1ebe97567403e2d3b7f043340bdfdf12033d6", skip = true },
    { sha = "37aaa060b6f9ead8329a7b4ca555ed101d189acd", skip = true },
    { sha = "d8d85d0b3f4900c008cc4016ea3ac8e12ad80207", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { message = "^revert", group = "<!-- 4 -->Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "newest"
